name: Idea
description: Suggest something the tool should do
labels: [idea]
body:
  - type: textarea
    id: idea
    attributes:
      label: What should it do
      description: >
        Aura Toggle is a switch, not a control suite — per-LED control and non-ASUS hardware are
        out of scope. Anything else is welcome.
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why
      description: What you are trying to achieve, and how you solve it today.
