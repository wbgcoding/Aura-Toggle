version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: "wednesday"
      time: "06:00"
      timezone: "Europe/Berlin"
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
  - package-ecosystem: nuget
    directory: /tests/AuraToggle.Tests
    schedule:
      interval: weekly
      day: "wednesday"
      time: "06:00"
      timezone: "Europe/Berlin"
  - package-ecosystem: pip
    directory: /.github/requirements
    schedule:
      interval: weekly
      day: "wednesday"
      time: "06:00"
      timezone: "Europe/Berlin"
